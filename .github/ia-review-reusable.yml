name: IA Code Review (Central)

on:
  workflow_call:
    secrets:
      GEMINI_KEY:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      
    steps:
      # 1. Baixa o código do repositório cliente (onde o PR foi aberto)
      - name: Checkout do código do PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Baixa o script TypeScript do repositório central
      # O parâmetro 'path' salva o script em uma pasta separada para não misturar com o projeto
      - name: Checkout do script de IA
        uses: actions/checkout@v4
        with:
          repository: 'SEU_USUARIO_OU_ORGANIZACAO/revisor-ia-central' # Mude para o seu nome real
          path: 'pasta-da-ia'

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências da IA
        run: npm install @google/genai tsx

      - name: Extrair o Diff do PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > diff.txt

      - name: Executar o Script de IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
        # Aponta para o script dentro da pasta que criamos no passo 2
        run: npx tsx pasta-da-ia/review.ts